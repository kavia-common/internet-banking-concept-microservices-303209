apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: internet-banking
  labels:
    app: service-registry
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-registry
  template:
    metadata:
      labels:
        app: service-registry
        tier: infrastructure
    spec:
      containers:
      - name: service-registry
        # TODO: Update with actual image after building and pushing to registry
        image: ghcr.io/org/service-registry:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8081"
        - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
          value: "false"
        - name: EUREKA_CLIENT_FETCH_REGISTRY
          value: "false"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://service-registry:8081/eureka"
        - name: EUREKA_INSTANCE_HOSTNAME
          value: "service-registry"
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "false"
        envFrom:
        - configMapRef:
            name: internet-banking-common-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
