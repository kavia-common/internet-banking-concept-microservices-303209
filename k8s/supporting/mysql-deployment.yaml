apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: internet-banking
  labels:
    app: mysql
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        tier: database
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
          name: mysql
          protocol: TCP
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpass"
          # TODO: Move to Secret and reference it via secretKeyRef
        - name: MYSQL_USER
          value: "bankuser"
        - name: MYSQL_PASSWORD
          value: "bankpass"
          # TODO: Move to Secret and reference it via secretKeyRef
        - name: MYSQL_DATABASE
          value: "banking_core"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: mysql-persistent-storage
        emptyDir: {}
        # TODO: Replace emptyDir with PersistentVolumeClaim for production
        # persistentVolumeClaim:
        #   claimName: mysql-pvc
