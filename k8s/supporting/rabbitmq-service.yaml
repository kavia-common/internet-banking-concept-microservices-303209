apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: internet-banking
  labels:
    app: rabbitmq
    tier: messaging
spec:
  type: ClusterIP
  ports:
  - port: 5672
    targetPort: 5672
    protocol: TCP
    name: amqp
  - port: 15672
    targetPort: 15672
    protocol: TCP
    name: management
  selector:
    app: rabbitmq
